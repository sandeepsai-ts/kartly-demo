<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Kartly</title><link rel="stylesheet" href="style.css"></head><body>
<a class="skip" href="#main">Skip to content</a><div id="site-header"></div>
<main class="wrap" id="main"><div class="auth">
  <h1 id="login-title">Sign in</h1><p class="sub">Welcome back. Sign in to see your orders and wishlist.</p>
  <div id="login-error" class="error" role="alert" style="display:none"></div>
  <form id="form" novalidate><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="off"></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="off"></div>
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><label class="inline"><input type="checkbox" id="remember"> Remember me</label><label class="inline"><input type="checkbox" id="show-pw"> Show password</label></div>
  <button id="login" class="btn primary" type="submit">Sign in</button></form>
  <div class="hint"><b>Demo account (test data only)</b><br>Username: demo_shopper<br>Password: Demo-Only-2026<br>More users and edge cases: <a href="lab-auth.html" style="text-decoration:underline">Authentication scenarios</a></div>
</div></main>
<div id="site-footer"></div>
<script src="app.js"></script><script src="lab.js"></script>
<script>Kartly.header();
document.getElementById("show-pw").addEventListener("change", function (e) { document.getElementById("password").type = e.target.checked ? "text" : "password"; });
document.getElementById("form").addEventListener("submit", function (e) { e.preventDefault();
  var r = Kartly.login(document.getElementById("username").value, document.getElementById("password").value, document.getElementById("remember").checked);
  if (r.ok) { var n = new URLSearchParams(location.search).get("next"); location.href = n && /^[a-z0-9_-]+\.html/i.test(n) ? n : "account.html"; }
  else { var b = document.getElementById("login-error"); b.textContent = r.msg; b.style.display = "block"; } });</script></body></html>
